<html>
<title> Diffrent UnOrder List Demo </title>
<head> Diffrent UnOrder List Demo </head>
<body>
<h1 style="background-color : yellow"> Simple : </h1>
<ul>
	<li> One </li>
	<li> Two </li>
	<li> Three </li>
</ul>
<h1 style="background-color : red"> Circle : </h1>
<ul type="circle">
	<li> One </li>
	<li> Two </li>
	<li> Three </li>
</ul>
<h1 style="background-color : green"> Disc : </h1>
<ul type="disc">
	<li> One </li>
	<li> Two </li>
	<li> Three </li>
</ul>
<h1 style="background-color : blue"> Square : </h1>
<ul type="square">
	<li> One </li>
	<li> Two </li>
	<li>Sub List 
		<ol>
			<li> One </li>
			<li> Two </li>
			<li> Three </li>
		</ol>
	</li>
</ul>

</body>
</html>
