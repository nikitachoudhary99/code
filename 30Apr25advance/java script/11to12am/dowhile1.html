<html>
<head>
<title>Java Script Demo</title>
<script>
document.write("<h1>Counting from 1 to 10.</h1>");
var i=11;
do
{
document.write("<h1>i = "+i+"</h1>");
i++;
}while(i<=10);
document.write("<h1>Do-While Loop</h1>");

</script>
</head>
<body>
<h1>This is heading displayed by Html.</H1>
</body>
</html>
