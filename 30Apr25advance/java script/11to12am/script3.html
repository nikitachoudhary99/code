<html>
<head>
<title>Java Script Demo</title>
<script>
var a = parseInt(prompt("Enter value of a:"));
if(a<100)
{
document.write("<h1>"+a+" is less than 100</h1>");
}
else
{
document.write("<h1>"+a+" is not less than 100</h1>");
}
</script>
</head>
<body>
<h1>This is heading displayed by Html.</H1>
</body>
</html>
