<html>
<head>
<title>Java Script Demo</title>
<script>
document.write("<h1>Counting from 10 to 1.</h1>");
var i=11;
while(i<=10)
{
document.write("<h1>i = "+i+"</h1>");
i--;
}
document.write("<h1>While Loop</h1>");

</script>
</head>
<body>
<h1>This is heading displayed by Html.</H1>
</body>
</html>
