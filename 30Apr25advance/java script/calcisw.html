
<html>
<head>
<script>
function calculat()
{
var a= parseInt(document.getElementById("t1").value);
var b= parseInt(document.getElementById("t2").value);
var d= parseInt(document.getElementById("t4").value);
var c=0;
switch(d)
{
	case 1:
	c = a+b;
	break;

	case 2:
	c = a-b;
	break;

	case 3:
	c = a*b;
	break;

	case 4:
	c = a/b;
	break;
		
	default:
	document.getElementById("t4").value="Invalid Choice";
}
document.getElementById("t3").value=c;
}
</script>
</head>
<body>
<center>
<h1>Universal Calculator</h1>

<hr>
<br><br>
Number1<input type=text name = "a" id="t1"><br><br>
Number2<input type=text name = "b" id="t2"><br><br>
Result<input type=text name = "c" id="t3"><br><br>
<h1>Add : 1</h1>
<h1>Sub : 2</h1>
<h1>Mul : 3</h1>
<h1>Div : 4</h1>
Enter Your Chouce Here:<input type="text" id="t4">
<br><br>
<button type="button" onclick="calculat()">Calculat</button>
<input type="reset">
<br><br><br><br>

<hr>
<br><br><br>
</center>
</body>
</html>
