<html>
<head>
<script>
function add(x,y)
{
var a= parseInt(x);
var b= parseInt(y);

//var a= (document.getElementById("t1").value);

var c =a+b;
//document.write("Answer = "+c);

}
function sub(x,y)
{
var a= parseInt(x);
var b= parseInt(y);

//var a= (document.getElementById("t1").value);
//var b= (document.getElementById("t2").value);

var c =a-b;
//document.write("Answer = "+c);
document.getElementById("t3").value=c;

function multi(x,y)
{
var a= parseInt(x);
var b= parseInt(y);

//var a= (document.getElementById("t1").value);
//var b= (document.getElementById("t2").value);

var c =a*b;
//document.write("Answer = "+c);

function div(x,y)
{

var b= parseInt(y);

//var a= (document.getElementById("t1").value);
//var b= (document.getElementById("t2").value);

var c =a/b;
//document.write("Answer = "+c);
document.getElementById("t3").value=c;
}

</script>
</head>
