<html>
    <head>
        <title>
            Demo Of Change The value of Container Elements
        </title>
        <script>
            function change()
            {
                document.getElementById("mehead").innerHTML="Value Badal Rahi He."
                document.getElementById("mepara").innerHTML="Meri value badal gai he."
            }
        </script>
    </head>
    <body>
        <h1 id="mehead">
            Demo Of Java Script.
        </h1>
        <p id="mepara">
            Please Change the containts...
        </p>
        <input type="button" onclick="change()" value="Click Me to change the containts">
    </body>
</html>
