<html>
    <head>
        <title>
            Java Script Demo
        </title>
    </head>
    <body>
        This is normal html text.<br>
        <script>
            document.write("This is text display by java script.<br>");
            document.write("<h1>This is heading display by java script.</h1><br>");
            document.write("<p>This is para display by java script.</p><br>");
            document.write("<font color=red size=8>This is font demo display by java script.</font><br>");
        </script>


    </body>
</html>
