<html>
<head>
<title>Dynamic Variables</title>
<script>
var a = 10;
document.write("<br>Integer = "+a);
a = 123.78;
document.write("<br>Float = "+a);
a = "Radhe Mohan";
document.write("<br>String = "+a);
a = true;
document.write("<br>Boolean = "+a);
</script>
</head>
<body>
<br>
Variable Demo</br>
Data Types:<br>
1.Integer<br>
2.Floating Point<br>
3.String<br>
4.Boolean<br>
</body>
</html>
