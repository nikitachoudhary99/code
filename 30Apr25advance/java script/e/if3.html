<html>
<head>
<title>If Demo</title>
<script>
var p = parseFloat(prompt("Enter Your Pecentage Marks:",""));
if(p>=60)
{
document.write("<font color=Green Size=10>I Div</font>");
}
else
{
	if(p>=45)
	{
	document.write("<font color=orange Size=7>II Div</font>");
	}
	else
	{
		if(p>=33)
		{
		document.write("<font color=yellow Size=5>III Div</font>");
		}
		else
		{
		document.write("<font color=red Size=3>FAIL</font>");

		}
	}
}
</script>
</head>
<body><br>
If Demo<br>
</html>
