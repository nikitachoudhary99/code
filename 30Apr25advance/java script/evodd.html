<html>
<head>
<script>
function evodd()
{
var a= parseInt(document.getElementById("t1").value);
var r = a%2;
if(r==0)
{
document.write(a+" Is Even");
}
else
{
document.write(a+" Is Odd");
}
}
</script>
</head>
<body>
<center>
<h1>Calculator</h1>

<hr>
<br><br><br><br><br><br><br><br><br><br><br>
Enter Any Number<input type=text name = "a" id="t1"><br><br>
<button type="button" onclick="evodd()">Check Even Or Odd</button>
<br><br><br><br><br><br><br><br><br><br>
<hr>
</center>
</body>
</html>
