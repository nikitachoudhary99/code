<html>
<head>
<title>IfDemo</title>
<script>
function sayHello(name,age)
{
document.write("<h1>Hello "+name+" is "+age+" year old</h1>");
}
</script>
</head>
<body>
<center>
<h1> Universal Informatics</h1>
<br><br><br>
<hr>
<input type="button" value="Click Me to Say Hello" onclick="sayHello('Vinayak ',23)">
</center>
</body>
</html>
