<html>
<head>
<title>IfDemo</title>
</head>
<body>
<script>
var p = parseFloat(prompt("Enter your percentage marks:",""));
if(p>=60)
{
document.write("<font color=green size=7>I Div</font>");
}
else
{
	if(p>=45)
	{
	document.write("<font color=green size=7>II Div</font>");
	}
	else
	{
		if(p>=33)
		{
		document.write("<font color=green size=7>III Div</font>");
		}
		else
		{
		document.write("<font color=green size=7>FAIL</font>");
		}
	}
}
</script>
</body>
</html>

*Book Staller
book<20   5 % discount
book<50   10 % discount
book<100  15 % discount
book>=100 20 % discount
