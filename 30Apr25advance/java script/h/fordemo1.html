<body>
<script>
var m = parseInt(prompt("Enter a value:","Enter value here"));
var n = parseInt(prompt("Enter a value:","Enter value here"));
var i;

for(i=m; i<=n; i++)
{
document.write("<br>i = "+i);
}
for(i=m; i>=n; i--)
{
document.write("<br>i = "+i);
}

</script>
</body>
