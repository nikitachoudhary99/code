<html>
<head>
<title>Function Demo</title>
<script>
function add(x,y)
{
var c = x+y;
return c;
}
function sayHello(sms)
{
document.write(sms+"<br>");
var result = add(100,200);
document.write("Sum = "+result);
}

</script>
</head>
<body>
Function Demo<br>
<input type="submit" onclick="sayHello('Vidhayak Nahi Bane')" value="Say Hello">
</body>
</html>
