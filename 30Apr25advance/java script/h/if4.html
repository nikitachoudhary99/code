<body>
<script>
var p = parseFloat(prompt("Enter first value:",""));
if(p>=60)
{
document.write("I Div");
}
else
{
	if(p>=45)
	{
	document.write("II Div");
	}
	else
	{
		if(p>=33)
		{
		document.write("III Div");
		}
		else
		{
		document.write("FAIL");
		}
	}
}
</script>
</body>
</html>
