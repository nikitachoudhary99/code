
<html>
<head>
<script>

function evenodd()
{
var a= parseInt(document.getElementById("t1").value);
var udao = a%2;
if(udao==0)
{
document.write(a+" is even");
}
else
{
document.write(a+" is odd");
}
}
</script>
</head>
<body>
<center>

<center>
<hr>

<button type="button" onclick="evenodd()">Check</button>
