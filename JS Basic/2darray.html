<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Dimensional Array</title>
    <script>
        function show(){
            var arr = [[4,7,6,1],[9,6,3,7],[2,4,6,8]];
            var i,j;
            for(i=0;i<3;i++)
            {
                for(j=0;j<4;j++)
                {
                    document.write(arr[i][j]+" ");
                }
                document.write("<br>");
            }
        }
    </script>
</head>
<body>
    <button type="submit" onclick="show()">Show</button>
</body>
</html>
