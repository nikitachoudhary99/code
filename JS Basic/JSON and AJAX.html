    <!-- AJAX example to load json data from API  -->

<html>
    <body>
        <div id="demo">
            <h1>Load Data From API</h1>
            <button type="submit" onclick="loadDoc()">Load Content</button>
        </div>
        <script>
            function loadDoc(){
                var xhttp = new XMLHttpRequest(); //create object
                xhttp.onreadystatechange = function(){
                    if(this.readyState == 4 && this.status == 200) {
                        document.getElementById("demo").innerHTML = this.responseText;
                    }
                };
                xhttp.open("GET", "https://jsonplaceholder.typicode.com/comments",true);
                xhttp.send();
            }
        </script>
    </body>
</html>
