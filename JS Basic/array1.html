<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
    <!-- Read input in array from user -->
     <script>
        function showFun(){
            var arr = new Array(10);
            var i;
            for(i=0;i<10;i++)
            {
                arr[i] = parseInt(prompt("Enter Number"));
            }
            document.write("output array:-<br>"+arr);
        }
     </script>
</head>
<body>
    <button type="submit" onclick="showFun()">Show</button>
</body>
</html>
