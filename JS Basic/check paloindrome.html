<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if Statement</title>
    <!-- Check Palindrome -->
     <script>
        function checkFun(){
            var num,h,t,u,rev;
            num=parseInt(document.getElementById("tb1").value);
            h=parseInt(num/100);
            t=parseInt(num/10)%10;
            u=num%10;
            rev=(u*100)+(t*10)+(h*1);
            if(num==rev){
                document.getElementById("tb2").value="palindrome";
            }
            if(num!=rev)
            {
                document.getElementById("tb2").value="Not palindrome";
            }
        }
     </script>
</head>
<body>
    <center>
        <h4>Check Palindrome or not palindrome</h4>
        <table border="1">
            <tr>
                <td>Enter the Number</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="checkFun()">Check</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
