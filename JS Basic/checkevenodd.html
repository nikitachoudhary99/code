<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if else Statement</title>
    <script>
        function checkNum(){
            var num;
            num = parseInt(document.getElementById("tb1").value);
            if(num%2==0)
            {
                document.getElementById("tb2").value="Number is Even";
            }
            else{
                document.getElementById("tb2").value="Number is Odd";
            }
        }
    </script>
</head>
<body>
    <center>
        <table border="1">
            <tr>
                <td>Enter Number</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="checkNum()">Check</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
