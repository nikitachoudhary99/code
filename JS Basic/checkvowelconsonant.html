<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if else Statement</title>
    <script>
        function checkAlpha(){
            var ch;
            ch=document.getElementById("tb1").value;
            if(ch=='a'||ch=='e'||ch=='i'||ch=='o'||ch=='u')
            {
                document.getElementById("tb2").value="Vowel";
            }
            else
            {
                document.getElementById("tb2").value="Consonant";
            }
        }
    </script>
</head>
<body>
    <center>
        <h4>Check Vowel or Consonant</h4>
        <table border="1">
            <tr>
                <td>Enter any Alphabet</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="checkAlpha()">Check</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
