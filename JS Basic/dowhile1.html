<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do While Loop</title>
    <!-- example do while loop controlling by decrement -->
     <script>
        function printNums(){
            var i=20;
            do{
                document.write(i+"<br>");
                i--;
            }while(i>=1);
        }
     </script>
</head>
<body>
    <button type="submit" onclick="printNums()">Print</button>
</body>
</html>
