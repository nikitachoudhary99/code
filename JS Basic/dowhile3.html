<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do While Loop</title>
    <!-- example do while loop controlling by operation -->
     <script>
        function revNum(){
             var num,rnum=0,r;
             num=parseInt(document.getElementById("tb1").value);
             do{
                r=num%10;
                rnum = rnum*10+r;
                num=parseInt(num/10);
             }while(num>0)
             document.getElementById("tb2").value=rnum;
        }
     </script>
</head>
<body>
    <center>
        <h4>Find Reverse of any number</h4>
        <table border="1">
            <tr>
                <td>Enter value of num</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="revNum()">Reverse</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
