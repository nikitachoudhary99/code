<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Factorial</title>
    <script>
        function calculateFactorial(){
            var num,i,f=1;
            num = parseInt(document.getElementById("tb1").value);
            for(i=num;i>=1;i--){

                f = f*i;
            }
            document.getElementById("tb2").value=f;
        }
    </script>
</head>
<body>
    <center>
        <h4>Calculate Factorial</h4>
        <table border="1">
            <tr>
                <td>Enter the number</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="calculateFactorial()">Calculate</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
