<!-- 
 The filter() method returns the all value of the element that passes a test.
 The filter() method execute a function for each array element.
 it returns multiple values.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var a=[5,8,6,10,3,11];
        function checkPrime(n){
            var c=0,i;
            for(i=1;i<=n;i++)
            {
                if(n%i==0)
                {
                    c=c+1;
                }
            }
            if(c==2)
            {
                return n;
            }
        }
        function myFun(){
            var res1 = a.filter(checkPrime);
            document.write(res1);
        }
    </script>
</head>
<body>
    <button type="submit" onclick="myFun()">SHOW</button>
</body>
</html>
