<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
    <!-- Store 10 Number in Array and Find Smallest Number-->
     <script>
        function findSmallest(){
            var arr = [2,55,63,89,78,14,47,62,23,31];
            var i,min;
            min = arr[0];
            for(i=1;i<10;i++)
            {
                if(arr[i]<min)
                {
                    min = arr[i];
                }
            }
            document.write("<br> Output Array:-<br>"+arr);
            document.write("<br> Smallest Number in Array is :- "+min);
        }
     </script>
</head>
<body>
    <button type="submit" onclick="findSmallest()">Find</button>
</body>
</html>
