<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for Loop</title>
    <!-- print number between 1 and 20 -->
    <script>
        function showNum(){
            var i;
            for(i=1;i<=20;i++)
            {
                document.write(i+"<br>");
            }
        }
    </script>
</head>
<body>
    <button type="submit" onclick="showNum()">Show</button>
</body>
</html>
