<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested ifelse Statement</title>
    <!-- Find largest number among three different number -->
     <script>
        function findMax(){
            var a,b,c;
            a=parseInt(document.getElementById("tb1").value);
            b=parseInt(document.getElementById("tb2").value);
            c=parseInt(document.getElementById("tb3").value);
            if(a>b)
            {
                if(a>c)
                {
                    document.getElementById("tb4").value="a is largest";
                }
            }
            if(c>a)
            {
                document.getElementById("tb4").value="c is largest";
            }
            if(b>a)
            {
                if(b>c)
                {
                    document.getElementById("tb4").value="b is largest";
                }
            }
            if(c>b)
            {
                document.getElementById("tb4").value="c is largest";
            }
        }
     </script>
</head>
<body>
    <center>
        <table border="">
            <tr>
                <td>Enter the value of a</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Enter the value of b</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Enter th evalue of c</td>
                <td>
                    <input type="text" id="tb3" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb4" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="findMax()">Check</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
