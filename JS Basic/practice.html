<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort</title>
    <script>
        function sortFun()
        {
            var a = [9,8,7,6,5,4,3,2,1];
            document.write("Before Sort :-  "+a);
            var b = a.sort();
            document.write("<br> After Sort :-  "+b); 
            var name = ["vedant","Trapti","Tanu","Aayushi"];
            document.write("<br> Before Sort :-  "+name);
            var sname = name.sort();
            document.write("<br> After Sort :-  "+sname);
        }
    </script>
</head>
<body>
    <button type="submit" onclick="sortFun()">Show</button>
</body>
</html>
