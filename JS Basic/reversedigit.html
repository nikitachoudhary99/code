<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Digit</title>
    <script>
        function reverseNum(){
            var n,rev,h,t,u;
            n=parseInt(document.getElementById("tb1").value);
            h=parseInt(n/100);
            t=parseInt(n/10)%10;
            u=n%10;
            rev=(u*100)+(t*10)+(h*1);
            document.getElementById("tb2").value=rev;
        }
    </script>
</head>
<body>
    <center>
        <table border="1">
            <tr>
                <td>Enter value of n</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb2">
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="reverseNum()">Reverse</button>
                </td>
            </tr>
        </table>
    </center>
    
</body>
</html>
