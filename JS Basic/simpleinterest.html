<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function findSimpleInterest(p,r,t){
            var si;
            si=p*r*t/100;
            return(si);
        }
        function MainFun(){
            var p,r,t,result;
            p=parseInt(document.getElementById("tb1").value);
            r=parseInt(document.getElementById("tb2").value);
            t=parseInt(document.getElementById("tb3").value);
            result=findSimpleInterest(p,r,t);
            document.getElementById("tb4").value=result;
        }
    </script>
</head>
<body>
    <center>
        <table>
            <tr>
                <td>Enter principal:</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Enter Rate (%):</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Enter Time (Year):</td>
                <td>
                    <input type="text" id="tb3" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb4" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="MainFun()">Check</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
