<!-- Sort() function.demo -->
 <!-- Sort() function is used to arrange elements in ascending order -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Function</title>
    <script>
        function show(){
            var a=[5,8,3,9,6,4,12,9,6,5];
            document.write(" before sort = "+a);
            var b=a.sort();
            document.write("<br> after sort = "+b);
            var name=["amit","sumit","rajesh","raj","bunty"];
            var sname=name.sort();
            document.write(" <br> name after sort "+sname)
        }
    </script>
</head>
<body>
    <button type="submit" onclick="show()">Show</button>
</body>
</html>
