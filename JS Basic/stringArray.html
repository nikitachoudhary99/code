<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
    <script>
        function myFun(){
            var myList = ["Aayushi","Tanu","Trapti","Vedant"];
            var i;
            document.write("Output");
            for(i=0;i<myList.length;i++){
                document.write("<br>"+myList[i]);
            }
        }
    </script>
</head>
<body>
    <button type="submit" onclick="myFun()">Show</button>
</body>
</html>
