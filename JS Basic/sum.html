<!-- Addition of two number -->
 <html>
    <head>
<script>
    function sumFun(){
        var a,b,c;
        a=parseInt(document.getElementById('tb1').value);
        b=parseInt(document.getElementById('tb2').value);
        c=a+b;
        document.getElementById("tb3").value=c;
    }
</script>
    </head>
    <body>
        <center>
            <h4>Add Two Number</h4>
            <table border="1">
                <tr>
                    <td>Enter value of a</td>
                    <td>
                        <input type="text" name="" id="tb1" />
                    </td>
                </tr>
                <tr>
                    <td>Enter value of b</td>
                    <td>
                        <input type="text" id="tb2" />
                    </td>
                </tr>
                <tr>
                    <td>Result</td>
                    <td>
                        <input type="text" id="tb3" />
                    </td>
                </tr>
                <tr>
                    <td>Click Here</td>
                    <td>
                        <button type="submit" onclick="sumFun()">Sum</button>
                    </td>
                </tr>
            </table>
        </center>
    </body>
 </html>
