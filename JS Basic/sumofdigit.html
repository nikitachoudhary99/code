<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Digit</title>
    <script>
        function digitSum(){
            var n,h,t,u,sum;
            n=parseInt(document.getElementById("tb1").value);
            h=parseInt(n/100);
            t=parseInt(n/10)%10;
            u=n%10;
            sum=h+t+u;
            document.getElementById("tb2").value=sum;
        }
    </script>
</head>
<body>
    <center>
        <table border="1">
            <tr>
                <td>Enter the value of n</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="digitSum()">Sum</button>
                </td>
            </tr>
        </table>
    </center>
    
</body>
</html>
