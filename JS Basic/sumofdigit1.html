<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do While loop</title>
    <!-- sum of digit of any number -->
     <script>
        function digitSum(){
            var num,r,sum=0;
            num=parseInt(document.getElementById("tb1").value);
            do{
                r = num%10;
                sum = sum+r;
                num = parseInt(num/10);
                if(num==0 && sum>9)
                {
                    num = sum;
                    sum = 0;
                }

            }while(num>0)
            document.getElementById("tb2").value=sum;
        }
     </script>
</head>
<body>
    <center>
        <h4>Sum of Digit of Any Number</h4>
        <table>
            <tr>
                <td>Enter Number</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="digitSum()">Sum</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
