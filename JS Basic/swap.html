<!-- Swaping of two number -->
<html>
    <head>
        <script>
        function swapFun(){
            
            var num1,num2,temp;
            num1=parseInt(document.getElementById("tb1").value);
            num2=parseInt(document.getElementById("tb2").value);
        
            temp=num1;
            num1=num2;
            num2=temp;
        
            
            document.getElementById("tb3").value=num1;
            document.getElementById("tb4").value=num2;
            
        }
    </script>
    </head>
    <body>
        <center>
            <h4>Swaping of Two Number</h4>
            <table border="1">
                <tr>
                    <td>Enter Value of First Number</td>
                    <td>
                        <input type="text" id="tb1" />
                    </td>
                </tr>
                <tr>
                    <td>Enter Value of Second Number</td>
                    <td>
                        <input type="text" id="tb2" />
                    </td>
                </tr>
                <tr>
                    <td>Click Here</td>
                    <td>
                        <button type="submit" onclick="swapFun()">Swap</button>
                    </td>
                </tr>
                <tr>
                    <td>After swap first Number</td>
                    <td>
                        <input type="text" id="tb3" />
                    </td>
                </tr>
                <tr>
                    <td>After swap second Number</td>
                    <td>
                        <input type="text" id="tb4" />
                    </td>
                </tr>
            </table>
        </center>
    </body>
</html>
