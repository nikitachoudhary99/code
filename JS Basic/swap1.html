<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap</title>
    <!-- Swaping two Number without using third  Variable -->
     <script>
        function swapNum(){
            var a,b;
            a=parseInt(document.getElementById("tb1").value);
            b=parseInt(document.getElementById("tb2").value);
            a=a+b;
            b=a-b;
            a=a-b;
            document.getElementById("tb3").value=a;
            document.getElementById("tb4").value=b;

        }
     </script>
</head>
<body>
    <center>
        <table border="1">
            <tr>
                <td>Enter the value of a</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Enter the value of b</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="swapNum()">Swap</button>
                </td>
            </tr>
            <tr>
                <td>After Swap First Number</td>
                <td>
                    <input type="text" id="tb3" />
                </td>
            </tr>
            <tr>
                <td>After Swap Second Number</td>
                <td>
                    <input type="text" id="tb4" />
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
