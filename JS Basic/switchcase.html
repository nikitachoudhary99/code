<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch case</title>
    <script>
        function check(){
            var ch;
            ch=document.getElementById("tb1").value;
            switch(ch)
            {
                case 'a':
                    document.getElementById("tb2").value="vowel";
                    break;
                case 'e':
                    document.getElementById("tb2").value="vowel";
                    break;
                case 'i':
                    document.getElementById("tb2").value="vowel";
                    break;
                case 'o':
                    document.getElementById("tb2").value="vowel";
                    break;
                case 'u':
                    document.getElementById("tb2").value="vowel";
                    break;
                default:
                    document.getElementById("tb2").value="consonant";
                    break;
            }
        }
    </script>
</head>
<body>
    <center>
        <table border="1">
            <tr>
                <td>enter an Alphabet in small letter</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Click here</td>
                <td>
                    <button type="submit" onclick="check()">Check</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
