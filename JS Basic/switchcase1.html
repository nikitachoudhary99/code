<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case</title>
    <script>
        function calcFun(){
            var a,b,c,choice;
            a=parseInt(document.getElementById("tb1").value);
            b=parseInt(document.getElementById("tb2").value);
            choice = document.getElementById("combo1").value;
            switch (choice)
            {
                case '+':
                    c=a+b;
                    document.getElementById("tb3").value="Sum is "+c;
                    break;
                case '-':
                    c=a-b;
                    document.getElementById("tb3").value="Subtraction is "+c;
                    break;
                case '*':
                    c=a*b;
                    document.getElementById("tb3").value="Multiplication is "+c;
                    break;
                case '/':
                    c=a/b;
                    document.getElementById("tb3").value="Division is "+c;
                    break;
                default:
                    document.getElementById("tb3").value='Please Select an Operation';
                 break;   
            }
        }
    </script>
</head>
<body>
    <center>
        <h4>Simple Calculator</h4>
        <table border="1">
            <tr>
                <td>Enter the value of a</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Enter the value of b</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Select Option</td>
                <td>
                    <select id="combo1">
                        <option value="Select">Select</option>
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">*</option>
                        <option value="/">/</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="calcFun()">Calculate</button>
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb3" />
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
