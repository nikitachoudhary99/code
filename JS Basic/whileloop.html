<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Loop</title>
    <script>
        function showFun(){
            var i=1;
            while(i<=10)
            {
                if(i%2==0)
                {
                    document.write(i+"<br>");
                }
                i++;
            }
        }
    </script>
</head>
<body>
    <button type="submit" onclick="showFun()">Show</button>
</body>
</html>
