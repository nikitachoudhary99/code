<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
    <script>
        function factorial(){
            var num,f=1;
            num=parseInt(document.getElementById("tb1").value);
            while(num>0)
            {
                f = f*num;
                num--;
            }
            document.getElementById("tb2").value=f;
        }
    </script>
</head>
<body>
    <center>
        <table border="1">
        <tr>
            <td>Enter the Number</td>
            <td>
                <input type="text" id="tb1" />
            </td>
        </tr>
        <tr>
            <td>Result</td>
            <td>
                <input type="text" id="tb2" />
            </td>
        </tr>
        <tr>
            <td>Click Here</td>
            <td>
                <button type="submit" onclick="factorial()">Show</button>
            </td>
        </tr>
        </table>
    </center>
</body>
</html>
