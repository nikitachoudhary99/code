<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While loop</title>
    <!-- example while loop controlling by operation -->
     <script>
        function digitSum(){
        var num,r,sum=0;
        num=parseInt(document.getElementById("tb1").value);
        while(num>0)
        {
            r=num%10;
            sum = sum + r;
            num=parseInt(num/10);
        }
        document.getElementById("tb2").value=sum;
    }
     </script>
</head>
<body>
    <table border="1">
        <tr>
            <td>Enter Any  Number</td>
            <td>
                <input type="text" id="tb1" />
            </td>
        </tr>
        <tr>
            <td>Result</td>
            <td>
                <input type="text" id="tb2" />
            </td>
        </tr>
        <tr>
            <td>Click Here</td>
            <td>
                <button type="submit" onclick="digitSum()">Sum</button>
            </td>
        </tr>
    </table>
</body>
</html>
