<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Digit</title>
    <script>
        function revNum(){
            var num,rev,rnum=0;
            num=parseInt(document.getElementById("tb1").value);
            while(num>0){
                rev = num%10;
                rnum = rnum*10+rev;
                num = parseInt(num/10);
            }
            document.getElementById("tb2").value=rnum;
        }
    </script>
</head>
<body>
    <center>
        <h1>Reverse Digit</h1>
        <table border="1">
            <tr>
                <td>Enter Any Number</td>
                <td>
                    <input type="text" id="tb1" />
                </td>
            </tr>
            <tr>
                <td>Result</td>
                <td>
                    <input type="text" id="tb2" />
                </td>
            </tr>
            <tr>
                <td>Click Here</td>
                <td>
                    <button type="submit" onclick="revNum()">Reverse</button>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
