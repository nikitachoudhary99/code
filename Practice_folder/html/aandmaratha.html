<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marriage Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
        background-image: url('images/backk.jpg'); 
    background-size:cover;
    background-repeat: no-repeat;
    background-position:center center;
    margin: 10;
    padding: 0;
    font-family: sans-serif;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h1, h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    section {
      margin-bottom: 35px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #555;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    .form-buttons {
      text-align: center;
      margin-top: 30px;
    }

    .form-buttons button {
      padding: 12px 25px;
      font-size: 16px;
      margin: 0 10px;
      border: none;
      border-radius: 5px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-buttons button:hover {
      background-color: #2980b9;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      input, select, textarea {
        font-size: 14px;
      }

      .form-buttons button {
        width: 100%;
        margin: 10px 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Marriage Registration Form</h1>
    <form>

      <!-- Personal Details -->
      <section>
        <h2>Personal Details</h2>

        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first_name" />

        <label for="middle-name">Middle Name</label>
        <input type="text" id="middle-name" name="middle_name" />

        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last_name" />

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" />

        <label for="subcaste">Subcaste</label>
        <select id="subcaste" name="subcaste">
          <option value="">-- Select Subcaste --</option>
          <option value="deshmukh">Deshmukh</option>
          <option value="96 kuli">96 Kuli</option>
          <option value="maratha">Maratha</option>
          <option value="kumbi">Kumbi</option>
          <option value="deshmukh maratha">Deshmukh Maratha</option>
          <option value="96 kuli maratha">96 Kuli Maratha</option>
          <option value="tirale kumbi">Tirale Kumbi</option>
          <option value="96 tirale kumbi">96 Tirale Kumbi</option>
        </select>

        <label for="status">Marital Status</label>
        <select id="status" name="marital_status">
          <option value="unmarried">Unmarried</option>
          <option value="married">Married</option>
        </select>

        <label for="height">Height</label>
        <select id="height" name="height">
          <option value="">-- Select Height --</option>
          <option value="5.0">5.0</option>
          <option value="5.1">5.1</option>
          <option value="5.2">5.2</option>
          <option value="5.3">5.3</option>
          <option value="5.4">5.4</option>
          <option value="5.5">5.5</option>
          <option value="5.6">5.6</option>
          <option value="5.7">5.7</option>
          <option value="5.8">5.8</option>
          <option value="5.9">5.9</option>
          <option value="6.0">6.0</option>
        </select>

        <label for="weight">Weight</label>
        <select id="weight" name="weight">
          <option value="">-- Select Weight --</option>
          <option value="60">60 kg</option>
          <option value="62">62 kg</option>
          <option value="64">64 kg</option>
          <option value="66">66 kg</option>
          <option value="68">68 kg</option>
          <option value="70">70 kg</option>
          <option value="72">72 kg</option>
          <option value="74">74 kg</option>
          <option value="76">76 kg</option>
        </select>

        <label for="blood-group">Blood Group</label>
        <select id="blood-group" name="blood_group">
          <option value="">-- Select --</option>
          <option value="A+">A+</option>
          <option value="B+">B+</option>
          <option value="A-">A-</option>
          <option value="B-">B-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>

        <label for="complexion">Complexion</label>
        <select id="complexion" name="complexion">
          <option value="">-- Select --</option>
          <option value="fair">Fair</option>
          <option value="black">Black</option>
          <option value="savla">Savla</option>
          <option value="gehuva">Gehuva</option>
          <option value="neemgora">Neemgora</option>
        </select>

        <label for="disability">Physical Disability</label>
        <select id="disability" name="disability">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>

        <label for="diet">Diet</label>
        <select id="diet" name="diet">
          <option value="vegetarian">Vegetarian</option>
          <option value="non-vegetarian">Non-Vegetarian</option>
        </select>

        <label for="spectacles">Spectacles</label>
        <select id="spectacles" name="spectacles">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>

        <label for="lens">Lens</label>
        <select id="lens" name="lens">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>

        <label for="personality">Personality Description</label>
        <textarea id="personality" name="personality" rows="3" placeholder="Write a few lines about yourself..."></textarea>
      </section>

      <!-- Photos -->
      <section>
        <h2>Profile Photos</h2>

        <label for="photo1">Upload First Profile Photo</label>
        <input type="file" id="photo1" name="photo1" />

        <label for="photo2">Upload Second Profile Photo (Optional)</label>
        <input type="file" id="photo2" name="photo2" />
      </section>

      <!-- Contact Info -->
      <section>
        <h2>Contact Information</h2>

        <label for="id-type">ID Type</label>
        <select id="id-type" name="id_type">
          <option value="">-- Select --</option>
          <option value="pan">PAN</option>
          <option value="aadhar">Aadhar</option>
          <option value="license </option>


      <label for="address">Full Address</label>
      <input type="text" id="address" name="address" />

      <label for="email">Email ID</label>
      <input type="email" id="email" name="email" required />

      <label for="mobile">Mobile (for SMS Alert)</label>
      <input type="tel" id="mobile" name="mobile" required />

      <label for="mobile2">Alternate Mobile</label>
      <input type="tel" id="mobile2" name="mobile2" />
    </section>

    <!-- Family Background, Expectations etc. -->
    <!-- You can repeat the same pattern above for other sections like Family Background, Education, Horoscope, Expectations, etc. -->

    <!-- Submit Button -->
    <div class="form-buttons">
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </div>

  </form>
</body>
</html>
